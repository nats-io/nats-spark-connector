name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Only runs when a tag like v1.0.0 is pushed

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: sbt/setup-sbt@v1    
    - name: Build V2 (Spark 3.5)
      working-directory: V2
      run: |
        echo "Building V2 for Spark 3.5"
        sbt clean test package assembly
        ls nats-spark-connector/target/scala-2.12/

    # Spark 4 only supports Scala 2.13, so this lands in target/scala-2.13/ with a
    # "-spark4" artifact name. No `clean` here: it would wipe the Spark 3.5 jars above.
    - name: Build V2 (Spark 4)
      working-directory: V2
      run: |
        echo "Building V2 for Spark 4"
        sbt -Dspark.version=4.1.2 test package assembly
        ls nats-spark-connector/target/scala-2.13/

    - name: Build Loadbalanced
      working-directory: load_balanced
      run: |
        echo "Building Loadbalanced"
        sbt clean test package assembly
        ls target/scala-2.12/

    # Same deal as V2: Spark 4 is Scala 2.13 only, lands in target/scala-2.13/ with a
    # "-spark4" artifact name, and must not `clean` away the Spark 3 jars above.
    - name: Build Loadbalanced (Spark 4)
      working-directory: load_balanced
      run: |
        echo "Building Loadbalanced for Spark 4"
        sbt -Dspark.version=4.1.2 test package assembly
        ls target/scala-2.13/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: |
          V2/nats-spark-connector/target/scala-2.12/*.jar
          V2/nats-spark-connector/target/scala-2.13/*spark4*.jar
          load_balanced/target/scala-2.12/*.jar
          load_balanced/target/scala-2.13/*spark4*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
        

